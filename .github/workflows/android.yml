name: Compilar APK Android

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar plataforma Android
        run: flutter create . --platforms=android --project-name country_access --org ar.com.country

      - name: Permisos (internet, cámara)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' "$M"

      - name: Activar desugaring
        run: |
          ls android/app
          python3 - <<'PYEOF'
          import os
          kts = os.path.exists('android/app/build.gradle.kts')
          f = 'android/app/build.gradle.kts' if kts else 'android/app/build.gradle'
          s = open(f).read()
          flag = 'isCoreLibraryDesugaringEnabled = true' if kts else 'coreLibraryDesugaringEnabled true'
          dep = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if kts
                 else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'")
          if 'compileOptions {' in s:
              s = s.replace('compileOptions {', 'compileOptions {\n        ' + flag, 1)
          elif 'android {' in s:
              s = s.replace('android {', 'android {\n    compileOptions {\n        ' + flag + '\n    }', 1)
          s += '\ndependencies {\n    ' + dep + '\n}\n'
          open(f, 'w').write(s)
          print(s)
          assert flag in s, 'NO SE PUDO ACTIVAR DESUGARING'
          PYEOF

      - run: flutter pub get

      - name: Compilar APK
        run: |
          flutter build apk --release --no-shrink \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: country-access-apk
          path: build/app/outputs/flutter-apk/app-release.apk
