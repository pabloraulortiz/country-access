name: Compilar APK Android

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar plataforma Android
        run: flutter create . --platforms=android --project-name country_access --org ar.com.country

      - name: Permisos (internet, cámara)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' "$M"

      - name: Desactivar R8 (ML Kit)
        run: |
          python3 - <<'PYEOF'
          import os
          kts = os.path.exists('android/app/build.gradle.kts')
          f = 'android/app/build.gradle.kts' if kts else 'android/app/build.gradle'
          s = open(f).read()
          if kts:
              old = 'signingConfig = signingConfigs.getByName("debug")'
              new = old + '\n            isMinifyEnabled = false\n            isShrinkResources = false'
          else:
              old = 'signingConfig signingConfigs.debug'
              new = old + '\n            minifyEnabled false\n            shrinkResources false'
          assert old in s, 'NO SE ENCONTRO signingConfig EN ' + f
          s = s.replace(old, new, 1)
          open(f, 'w').write(s)
          print(s)
          PYEOF

      - run: flutter pub get

      - name: Compilar APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: country-access-apk
          path: build/app/outputs/flutter-apk/app-release.apk
